name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check OpenWeather API key configuration
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          if [ -z "$OPENWEATHER_API_KEY" ]; then
            echo "::warning::OPENWEATHER_API_KEY secret is not configured; dashboard will show an API-key message."
          else
            echo "OpenWeather API key secret is configured."
          fi
      - name: Create config.js from repository secret
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          node -e 'require("node:fs").writeFileSync("config.js", "const API_KEY = " + JSON.stringify(process.env.OPENWEATHER_API_KEY || "") + ";")'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
