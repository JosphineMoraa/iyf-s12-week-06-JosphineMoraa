<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple weather dashboard powered by OpenWeather.">
  <title>Week 6 Weather Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="dashboard">
    <header class="header">
      <p class="eyebrow">IYF · Season 12 · Week 6</p>
      <h1>Weather Dashboard</h1>
      <p class="subtitle">Find current weather conditions for any city.</p>
    </header>

    <form id="search-form" class="search-form">
      <label class="sr-only" for="city-input">City name</label>
      <input id="city-input" name="city" type="search" placeholder="Enter a city (e.g. Nairobi)" autocomplete="off" required>
      <button id="search-button" type="submit">Search weather</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite">Search for a city to see its current weather.</p>

    <section id="weather-card" class="weather-card" aria-label="Current weather" hidden>
      <div class="weather-heading">
        <div>
          <p id="weather-date" class="weather-date"></p>
          <h2 id="city-name"></h2>
          <p id="weather-description" class="description"></p>
        </div>
        <img id="weather-icon" alt="" width="100" height="100" hidden>
      </div>
      <p class="temperature"><span id="temperature">--</span><span>°C</span></p>
      <p class="feels-like">Feels like <span id="feels-like">--</span>°C</p>
      <div class="details">
        <article class="detail"><span class="detail-label">Humidity</span><strong id="humidity">--%</strong></article>
        <article class="detail"><span class="detail-label">Wind speed</span><strong id="wind-speed">-- m/s</strong></article>
        <article class="detail"><span class="detail-label">Pressure</span><strong id="pressure">-- hPa</strong></article>
        <article class="detail"><span class="detail-label">Visibility</span><strong id="visibility">-- km</strong></article>
      </div>
    </section>

    <footer><p>Weather data provided by OpenWeather.</p></footer>
  </main>
</body>
</html>
